[project]
name = "skywarden-backend"
version = "0.1.0"
description = "Fail-closed mission intelligence adapter for SkyWarden"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "openai>=1.50,<4",
  "httpx>=0.27,<1",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["app*", "bench*"]

[tool.setuptools.package-data]
"app.llm.prompts" = ["*.md"]
